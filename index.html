<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İstanbul Anlık Trafik</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 15px;
}
.container {
    max-width: 650px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
}
label {
    margin-top: 10px;
    display: block;
}
select, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
}
button {
    background: #1e73be;
    color: #fff;
    border: none;
    cursor: pointer;
}
.back-btn {
    background: #555;
    margin-top: 10px;
}
iframe {
    width: 100%;
    height: 420px;
    margin-top: 15px;
    border: none;
}
</style>
</head>

<body>

<div class="container">
    <h3>🚦 İstanbul İlçeler Arası Anlık Trafik</h3>

    <label>Başlangıç İlçesi</label>
    <select id="from">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <label>Varış İlçesi</label>
    <select id="to">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <button onclick="showRoute()">Trafiği Göster</button>

    <iframe id="map"
        src="https://www.google.com/maps?q=Istanbul&output=embed">
    </iframe>

    <button class="back-btn"
        onclick="window.location.href='https://batuhangorgu.wordpress.com/%f0%9f%9a%a6-istanbul-anlik-trafik-durumu/'">
        ⬅ Geri Dön
    </button>
</div>

<script>
function showRoute() {
    var from = document.getElementById("from").value;
    var to = document.getElementById("to").value;

    if (from === "" || to === "") {
        alert("Lütfen iki ilçe seçiniz.");
        return;
    }

    var embedUrl =
        "https://www.google.com/maps/embed/v1/directions" +
        "?key=" + "" +
        "&origin=" + encodeURIComponent(from + ", İstanbul") +
        "&destination=" + encodeURIComponent(to + ", İstanbul") +
        "&mode=driving";

    // API key olmadan çalışması için alternatif embed
    embedUrl =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(from + " - " + to + " İstanbul") +
        "&output=embed";

    document.getElementById("map").src = embedUrl;
}
</script>

</body>
</html>
