<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İstanbul Anlık Trafik</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 15px;
}

.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #555;
    color: #fff;
    padding: 8px 12px;
    text-decoration: none;
    border-radius: 5px;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: 60px auto 0;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
}

select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button {
    background: #1e73be;
    color: white;
    border: none;
    cursor: pointer;
}

.info {
    margin-top: 10px;
    font-size: 14px;
    color: #333;
    background: #f1f1f1;
    padding: 8px;
    border-radius: 5px;
}
</style>
</head>

<body>

<a class="back-btn" href="https://batuhangorgu.wordpress.com/%f0%9f%9a%a6-istanbul-anlik-trafik-durumu/">
⬅ Geri Dön
</a>

<div class="container">
    <h3>🚦 İstanbul İlçeler Arası Anlık Trafik</h3>

    <label>Başlangıç İlçesi</label>
    <select id="from">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <label>Varış İlçesi</label>
    <select id="to">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <button onclick="openTraffic()">Trafiği Göster</button>

    <div class="info">
        Seçilen iki ilçe arasındaki <b>anlık trafik yoğunluğu, süre ve alternatif yollar</b>
        Google Haritalar üzerinde <b>canlı olarak</b> gösterilir.
    </div>
</div>

<script>
function openTraffic() {
    var from = document.getElementById("from").value;
    var to = document.getElementById("to").value;

    if (from === "" || to === "") {
        alert("Lütfen iki ilçe seçiniz.");
        return;
    }

    var url =
        "https://www.google.com/maps/dir/" +
        encodeURIComponent(from + ", İstanbul") + "/" +
        encodeURIComponent(to + ", İstanbul") +
        "/?travelmode=driving&traffic=on";

    window.open(url, "_blank");
}
</script>

</body>
</html>
