<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İstanbul Trafik Durumu</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 15px;
}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
}
select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
button {
    background: #1e73be;
    color: white;
    border: none;
    cursor: pointer;
}
iframe {
    width: 100%;
    height: 400px;
    margin-top: 15px;
    border: none;
}
</style>
</head>

<body>

<div class="container">
    <h3>🚦 İstanbul İlçeler Arası Trafik</h3>

    <label>Başlangıç İlçesi</label>
    <select id="from">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <label>Varış İlçesi</label>
    <select id="to">
        <option value="">Seçiniz</option>
        <option>Kadıköy</option>
        <option>Beşiktaş</option>
        <option>Üsküdar</option>
        <option>Bakırköy</option>
        <option>Esenyurt</option>
        <option>Bağcılar</option>
        <option>Fatih</option>
        <option>Şişli</option>
        <option>Pendik</option>
        <option>Avcılar</option>
    </select>

    <button onclick="showRoute()">Trafiği Göster</button>

    <iframe id="map"></iframe>
</div>

<script>
function showRoute() {
    var from = document.getElementById("from").value;
    var to = document.getElementById("to").value;

    if(from === "" || to === "") {
        alert("Lütfen iki ilçe de seçiniz.");
        return;
    }

    var url = "https://www.google.com/maps/dir/?api=1"
        + "&origin=" + encodeURIComponent(from + ", İstanbul")
        + "&destination=" + encodeURIComponent(to + ", İstanbul")
        + "&travelmode=driving"
        + "&traffic_model=best_guess";

    document.getElementById("map").src = url;
}
</script>

</body>
</html>
