<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İstanbul Anlık Trafik Durumu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        h2 {
            text-align: center;
            padding: 15px;
            background: #1e73be;
            color: white;
            margin: 0;
        }
        .map-container {
            width: 100%;
            height: 500px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .info {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            background: #fff;
        }
    </style>
</head>
<body>

<h2>🚦 İstanbul Anlık Trafik Durumu</h2>

<div class="map-container">
    <iframe 
        src="https://www.google.com/maps?q=Istanbul&output=embed&layer=t"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</div>

<div class="info">
    Kırmızı alanlar yoğun trafiği, sarı alanlar orta yoğunluğu göstermektedir.
</div>

</body>
</html>
